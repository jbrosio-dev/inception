version: '3.8'

services:
  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    restart: on-failure
    env_file: .env
    networks:
      - inception_net
    volumes:
      - db_data:/var/lib/mysql
    # Damos acceso a MariaDB a estos dos secretos
    secrets:
      - sql_password
      - sql_root_password
    
  redis:
    build:
      context: ./requirements/bonus/redis
      dockerfile: Dockerfile
    container_name: redis
    restart: on-failure
    networks:
      - inception_net

  ftp:
    build:
      context: ./requirements/bonus/ftp
      dockerfile: Dockerfile
    container_name: ftp
    restart: on-failure
    env_file: .env
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    networks:
      - inception_net
    volumes:
      - wp_data:/var/www/wordpress
    secrets:
      - ftp_password
    depends_on:
      - wordpress

  adminer:
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
    container_name: adminer
    restart: on-failure
    ports:
      - "8080:8080"
    networks:
      - inception_net
    depends_on:
      - mariadb

  static_web:
    build:
      context: ./requirements/bonus/static_web
      dockerfile: Dockerfile
    container_name: static_web
    restart: on-failure
    ports:
      - "1337:1337"
    networks:
      - inception_net

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    restart: on-failure
    env_file: .env
    depends_on:
      - mariadb
    networks:
      - inception_net
    volumes:
      - wp_data:/var/www/wordpress
    # Damos acceso a WordPress a estos tres secretos
    secrets:
      - sql_password
      - wp_admin_password
      - wp_user_password

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: on-failure
    depends_on:
      - wordpress
    ports:
      - "443:443"
    networks:
      - inception_net
    volumes:
      - wp_data:/var/www/wordpress

  portainer:
    build:
      context: ./requirements/bonus/portainer
      dockerfile: Dockerfile
    container_name: portainer
    restart: on-failure
    ports:
      - "9000:9000"
    networks:
      - inception_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

networks:
  inception_net:
    driver: bridge
    name: inception_net

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress
  portainer_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/portainer

secrets:
  sql_password:
    file: ../secrets/sql_password.txt
  sql_root_password:
    file: ../secrets/sql_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file: ../secrets/user_password_ftp.txt
server {
    # Escuchar únicamente en el puerto 443 con SSL
    listen 443 ssl;
    listen [::]:443 ssl;
    
    # Tu nombre de dominio obligatorio
    server_name tu_login.42.fr;

    # Rutas a los certificados que generaremos en el Dockerfile
    ssl_certificate /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;
    
    # Protocolos estrictos requeridos por el subject
    ssl_protocols TLSv1.2 TLSv1.3;

    # Directorio raíz donde están los archivos de WordPress (en el volumen compartido)
    root /var/www/wordpress;
    index index.php index.html index.htm;

    # Si no encuentra un archivo, devuelve un error 404
    location / {
        try_files $uri $uri/ =404;
    }

    # Desvío de todas las peticiones PHP hacia el contenedor de WordPress
    location ~ \.php$ {
        # Incluye configuraciones por defecto de NGINX para FastCGI
        include snippets/fastcgi-php.conf;
        
        # Apuntamos al contenedor 'wordpress' (resuelto por la red interna de Docker) en el puerto 9000
        fastcgi_pass wordpress:9000;
    }
}

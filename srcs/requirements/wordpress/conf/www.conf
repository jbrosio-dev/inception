[www]
; El usuario y grupo bajo el que correrá WordPress
user = www-data
group = www-data

; Escuchar peticiones en el puerto 9000 desde cualquier IP de la red interna
listen = 9000

; Procesos dinámicos para no consumir toda la RAM de tu Máquina Virtual
pm = dynamic
pm.max_children = 25
pm.start_servers = 5
pm.min_spare_servers = 1
pm.max_spare_servers = 10
